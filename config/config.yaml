# 项目配置
app:
  # 项目名称
  name: LeotureWeb
  # 项目版本
  version: 0.0.1
  # 环境模式 dev | test | staging | prod
  env: dev

# HTTP服务配置 gin
server:
  # 服务监听地址
  host: 127.0.0.1
  # 服务监听端口
  port: 8080
  # Gin 运行模式: debug | release | test
  mode: debug
  # 是否启用跨域中间件
  enabled_cors: true

# HTTP服务跨域配置
cors:
  # 允许访问的前端域名, 生产环境务必收紧
  allow_origins:
    - http://localhost:9527
    - https://leoture.com
    - https://www.leoture.com
  # 允许的 HTTP 方法
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  # 允许的请求头
  allow_headers:
    - Authorization
    - Content-Type
    - X-Request-ID
  # 暴露给客户端的响应头
  expose_headers:
    - Content-Length
    - X-Request-ID
  # 是否允许携带凭证 (Cookie | Authorization)
  allow_credentials: true
  # 预检请求缓存时间 ns | us | ms | s | m | h
  max_age: 10m

# 项目日志配置 (slog)
log:
  # 日志级别: debug | info | warn | error
  level: debug
  # 日志格式: json | text
  format: json
  # 是否记录源码位置（文件名 + 行号）
  add_source: true
  # 日志文件路径，空值表示输出到 stdout
  file_path: leoture.log
  # 单个日志文件最大大小（MB）
  max_size: 10
  # 保留的旧日志文件数量
  max_backups: 10
  # 日志保留天数
  max_age: 3
  # 是否压缩旧日志文件
  compress: false

# 定时任务配置 (robfig/cron)
scheduler:
  # 是否启用定时任务组件
  enabled: false
  # 定时任务时区
  timezone: "Asia/Shanghai"
  # 定时任务列表
  jobs:
    # 示例定时任务
    example_job:
      # 任务是否启用
      enabled: true
      # Cron 表达式（秒 分 时 日 月 周）
      spec: "0 0/1 * * * *"
      # 任务描述
      desc: "scheduler example_job"

# Postgres 数据库配置 (pgx)
database:
  # 数据库主机地址
  host: "192.168.2.35"
  # 数据库端口
  port: 5432
  # 数据库用户名
  user: "leoture_web"
  # 数据库密码
  password: "leotureWeb_service"
  # 数据库名称
  dbname: "leoture_web"
  # SSL 连接模式: disable | require | verify-full
  ssl_mode: "disable"
  # 连接池最大连接数（建议 CPU * 2 ~ CPU * 4）
  max_conns: 10
  # 连接池最小空闲连接数 max_conns/2
  min_conns: 5
  # 连接最大存活时间  ns | us | ms | s | m | h
  max_conn_lifetime: 30m
  # 空闲连接最大存活时间  ns | us | ms | s | m | h
  max_conn_idle_time: 5m
  # 健康检查周期  ns | us | ms | s | m | h
  health_check_period: 1m
  # 建立连接超时时间  ns | us | ms | s | m | h
  connect_timeout: 10s
  # SQL 语句执行超时时间  ns | us | ms | s | m | h
  statement_timeout: 5s
  # 锁等待超时时间  ns | us | ms | s | m | h
  lock_timeout: 3s
  # 事务内空闲超时时间  ns | us | ms | s | m | h
  idle_in_transaction_session_timeout: 30s

# Redis 缓存配置 (go-redis)
redis:
  # 是否启用 Redis
  enabled: false
  # 地址（host:port）
  addr:
  # 密码
  password:
  # 数据库编号
  database:
  # 连接池最大连接数
  pool_size: 10
  # 最小空闲连接数
  min_idle_conns: 5
  # 连接最大存活时间 ns | us | ms | s | m | h
  conn_max_lifetime: 1h
  # 空闲连接最大存活时间 ns | us | ms | s | m | h
  conn_max_idle_time: 5m
  # 建立连接超时 ns | us | ms | s | m | h
  dial_timeout: 5s
  # 读超时 ns | us | ms | s | m | h
  read_timeout: 3s
  # 写超时 ns | us | ms | s | m | h
  write_timeout: 3s
  # 连接池获取连接超时 ns | us | ms | s | m | h
  pool_timeout: 4s

# JWT权限配置
jwt:
  # 签名算法，仅支持: HS256 | ES256 | EdDSA
  algorithm: "HS256"
  # HS256 密钥, 至少32字节
  secret: "leoture-web-default-secret-key-please-change-in-production"
  # ES256 | EdDSA 私钥PEM(PKCS#8格式)
  private_key: ""
  # ES256 | EdDSA 公钥 PEM(PKIX格式)
  public_key: ""
  # Token 签发者标识
  issuer: "leoture"
  audience:
   - "leoture-goweb"
  # AccessToken 有效期  ns | us | ms | s | m | h
  access_token_expire: 30m
  # RefreshToken 有效期  ns | us | ms | s | m | h
  refresh_token_expire: 168h

# Casbin RBAC 权限配置
casbin:
  # RBAC 模型配置文件路径
  model_path: "config/rbac.conf"
  # Casbin 规则表名
  table_name: "casbin_rule"
  # 权限策略缓存时间 ns | us | ms | s | m | h
  cache_ttl: 1h
  # 是否启用 Redis Watcher（多实例同步）
  enabled_redis_watcher: false
  # Redis Watcher 订阅频道名称
  watcher_channel: "casbin_watcher"

# Swagger接口文档配置
swagger:
  # 是否启用 Swagger 文档
  enabled: true
  # API 文档标题
  title: LeotureWeb API
  # API 文档描述
  desc: 基于 Gin 的 Web 项目 API 文档
  # Swagger UI 访问路径
  path: /swagger
