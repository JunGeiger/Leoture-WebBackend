basePath: /api/v1
definitions:
  errors.ResponseCode:
    enum:
    - 1000
    - 1001
    - 1002
    - 1003
    - 4000
    - 4001
    - 4002
    - 4003
    - 4004
    - 4009
    - 4029
    - 5000
    - 5003
    - 5004
    - 5005
    - 5006
    type: integer
    x-enum-varnames:
    - CodeSuccess
    - CodeCreated
    - CodeUpdated
    - CodeDeleted
    - CodeInvalidParam
    - CodeUnauthenticated
    - CodeTokenExpired
    - CodeForbidden
    - CodeNotFound
    - CodeAlreadyExists
    - CodeTooManyRequests
    - CodeInternal
    - CodeServiceUnavailable
    - CodeTimeout
    - CodeDatabaseError
    - CodeCacheError
  request.MenuCreate:
    properties:
      name:
        description: 菜单名称
        type: string
      parentID:
        description: 父菜单ID
        type: string
      path:
        description: 路由地址
        type: string
      sort:
        description: 菜单排序
        type: integer
      status:
        description: 数据状态：1:正常, 2:禁用
        enum:
        - 1
        - 2
        type: integer
      type:
        description: 菜单类型：1-目录, 2-菜单, 3-按钮, 4-路由
        enum:
        - 1
        - 2
        - 3
        - 4
        type: integer
    required:
    - name
    - parentID
    - path
    - sort
    - status
    - type
    type: object
  request.MenuUpdate:
    properties:
      id:
        type: string
      name:
        description: 菜单名称
        type: string
      parentId:
        description: 父菜单ID
        type: string
      path:
        description: 路由地址
        type: string
      sort:
        description: 菜单排序
        type: integer
      status:
        description: 数据状态：1:正常, 2:禁用
        enum:
        - 1
        - 2
        type: integer
      type:
        description: 菜单类型：1-目录, 2-菜单, 3-按钮, 4-路由
        enum:
        - 1
        - 2
        - 3
        - 4
        type: integer
    required:
    - id
    type: object
  request.RoleCreate:
    properties:
      code:
        description: 角色编码
        type: string
      name:
        description: 角色名称
        type: string
      remark:
        description: 角色说明
        type: string
      status:
        description: 数据状态：1:正常, 2:禁用
        enum:
        - 1
        - 2
        type: integer
    required:
    - code
    - name
    - status
    type: object
  request.RoleMenus:
    properties:
      menuIDs:
        description: 多个菜单ID
        items:
          type: string
        type: array
      roleID:
        description: 角色ID
        type: string
    required:
    - menuIDs
    - roleID
    type: object
  request.RoleUpdate:
    properties:
      code:
        description: 角色编码
        type: string
      id:
        type: string
      name:
        description: 角色名称
        type: string
      remark:
        description: 角色说明
        type: string
      status:
        description: 数据状态：1:正常, 2:禁用
        enum:
        - 1
        - 2
        type: integer
    required:
    - id
    type: object
  request.UserCreate:
    properties:
      email:
        description: 用户邮箱
        type: string
      nickname:
        description: 用户昵称
        type: string
      password:
        description: 用户密码
        type: string
      phone:
        description: 用户手机号码
        type: string
      status:
        description: 数据状态：1:正常, 2:禁用
        enum:
        - 1
        - 2
        type: integer
      username:
