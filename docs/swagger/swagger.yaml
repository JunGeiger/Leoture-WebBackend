  response.MenuResp:
    properties:
      createdTime:
        description: 创建时间
        type: string
      id:
        description: 菜单ID
        type: string
      name:
        description: 菜单名称
        type: string
      parentID:
        description: 菜单父ID
        type: string
      path:
        description: 路由地址
        type: string
      sort:
        description: 菜单排序
        type: integer
      status:
        description: 数据状态：1:正常, 2:禁用
        type: integer
      type:
        description: 菜单类型：1-目录, 2-菜单, 3-按钮, 4-路由
        type: integer
      updatedTime:
        description: 更新时间
        type: string
    type: object
  response.MenuTreeResp:
    properties:
      children:
        items:
          $ref: '#/definitions/response.MenuTreeResp'
        type: array
      createdTime:
        description: 创建时间
        type: string
      id:
        description: 菜单ID
        type: string
      name:
        description: 菜单名称
        type: string
      parentID:
        description: 菜单父ID
        type: string
      path:
        description: 路由地址
        type: string
      sort:
        description: 菜单排序
        type: integer
      status:
        description: 数据状态：1:正常, 2:禁用
        type: integer
      type:
        description: 菜单类型：1-目录, 2-菜单, 3-按钮, 4-路由
        type: integer
      updatedTime:
        description: 更新时间
        type: string
    type: object
  response.RoleResp:
    properties:
      code:
        description: 角色编码
        type: string
      created_at:
        description: 创建时间
        type: string
      id:
        description: 角色ID
        type: string
      name:
        description: 角色名称
        type: string
      remark:
        description: 角色说明
        type: string
      status:
        description: 数据状态：1:正常, 2:禁用
        type: integer
      updated_at:
        description: 更新时间
        type: string
    type: object
  response.SwaggerPaginatedData:
    properties:
      list:
        description: 当前页数据列表（空时返回 [] 而非 null）
      page:
        description: 当前页码（从 1 开始）
        type: integer
      page_size:
        description: 每页条数
        type: integer
      total:
        description: 总记录数
        type: integer
      total_pages:
        description: 总页数（自动计算）
        type: integer
    type: object
  response.SwaggerResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/errors.ResponseCode'
        description: 业务状态码
      data:
        description: 业务数据，错误时省略
      message:
        description: 面向用户的提示信息
        type: string
      request_id:
        description: 请求唯一标识
        type: string
    type: object
  response.UserResp:
    properties:
      created_at:
        description: 创建时间
        type: string
      email:
        description: 邮箱地址
        type: string
      id:
        description: 用户ID
        type: string
      nickname:
        description: 用户昵称
        type: string
      phone:
        description: 手机号码
        type: string
      status:
        description: 数据状态：1:正常, 2:禁用
        type: integer
      updated_at:
        description: 更新时间
        type: string
      username:
        description: 用户名称
        type: string
    type: object
