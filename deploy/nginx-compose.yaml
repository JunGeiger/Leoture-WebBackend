services:
  nginx:
    image: nginx:1.30.3
    container_name: nginx
    restart: unless-stopped
    ports: # 端口映射
      - "80:80"
      - "443:443"
    volumes: # 配置文件挂载
      # 主配置文件（只读挂载，防止容器内误修改）
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 站点配置目录（支持多站点 conf.d/*.conf）
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL 证书目录
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # 静态资源 / 网站根目录
      - ./www:/usr/share/nginx/html:ro
      # 日志目录（持久化到宿主机，方便 ELK/Loki 采集）
      - ./nginx/logs:/var/log/nginx
    networks:
      - nginx-net
    environment:
      - TZ=Asia/Shanghai # 时区设置
    cpus: 2.0 # cpu限制
    mem_limit: 512M # 内存限制
    memswap_limit: 512M
    healthcheck: # 健康检查
      # 使用 curl 而非 wget
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
networks:
  nginx-net:
    name: leoture_nginx_net
    driver: bridge
