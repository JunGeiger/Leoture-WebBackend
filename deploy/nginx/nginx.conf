# ============================================================
# nginx 主配置文件（前端代理专用）
# nginx: 1.30.3
# 场景：Docker / Docker Compose / 静态站点 / SPA
# 原则：稳定优先、资源可控、配置可审计
# ============================================================

# 运行用户（官方镜像默认）
user nginx;

# Worker 进程数
# 建议与 docker-compose 中 cpus 保持一致
# 2C 容器环境下设为 2，避免上下文切换浪费
worker_processes 2;
# 单 worker 进程可打开的最大文件描述符数
# 必须 ≥ worker_connections，否则 Nginx 启动会报 FD 不足错误
# Docker 环境默认 ulimit 为 1024，此处显式提升至 65535
worker_rlimit_nofile 65535;

# 错误日志路径及级别
# warn：生产环境推荐，error 过于粗糙，debug 极耗 IO
error_log /var/log/nginx/error.log warn;

# PID 文件路径（容器内需存在，否则 reload 失败）
pid /var/run/nginx.pid;

# ============================================================
# Events 模块：并发与连接处理
# ============================================================
events {
    # Linux 高性能 IO 事件模型（必需）
    use epoll;

    # 单 worker 最大并发连接数
    # 实际并发上限 = worker_processes × worker_connections
    # 本配置：2 × 2048 = 4096 并发连接
    worker_connections 2048;

    # 一次 accept 调用接收多个新连接
    # 提高高并发场景下的吞吐能力
    multi_accept on;

    # 关闭 accept 互斥锁
    # 容器环境中可减少惊群效应，提高连接分配效率
    accept_mutex off;
}

# ============================================================
# HTTP 核心模块
# ============================================================
http {
    # --------------------------------------------------------
    # MIME 类型与字符集
    # --------------------------------------------------------
    # MIME 类型映射表（必须）
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # 哈希表大小（防止 reload 时报错）
    types_hash_max_size 2048;
    types_hash_bucket_size 64;
    # Server Name 哈希（多域名 / 长域名 / 中文域名必备）
    server_names_hash_bucket_size 64;
    # Map 哈希（为限流、灰度、UA 判断等预留）
    map_hash_max_size 2048;
    map_hash_bucket_size 64;
    # 默认字符集（防止中文乱码）
    charset utf-8;
    # 启用 ETag（静态资源缓存协商，默认 on，显式声明更安全）
    etag on;
    # 允许符号链接（Docker volume 挂载常见，明确关闭限制）
    disable_symlinks off;

    # --------------------------------------------------------
    # 日志配置
    # --------------------------------------------------------
    # 主日志格式（当前未全局启用）
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    # 前端代理场景下全局关闭 access_log
    # 可显著降低磁盘 IO，需要时可在 server/location 中单独开启
    access_log off;

    # --------------------------------------------------------
    # 传输性能优化
    # --------------------------------------------------------
    # 启用 sendfile，使用内核零拷贝发送静态文件
    sendfile on;
    # 合并数据包，提升网络传输效率（配合 sendfile）
    tcp_nopush on;
    # 禁用 Nagle 算法，降低小包延迟
    tcp_nodelay on;

    # --------------------------------------------------------
    # 连接管理（稳定性 & 防资源耗尽）
    # --------------------------------------------------------
    # 长连接超时时间（秒）
    # 前端场景 30s 足够，过长会占用 worker 连接数
    keepalive_timeout 30;
    # 单个长连接上可处理的最大请求数
    # 降低连接重建成本，提高吞吐
    keepalive_requests 1000;
    # 向客户端发送响应的超时时间
    send_timeout 15;

    # --------------------------------------------------------
    # 客户端请求限制（安全防护）
    # --------------------------------------------------------
    # 客户端请求体最大值（影响上传）
    client_max_body_size 10m;
    # 请求体缓冲区大小，超过将写入临时文件
    client_body_buffer_size 128k;
    # 请求头读取超时
    client_header_timeout 10;
    # 请求体读取超时
    client_body_timeout 10;
    # 请求头缓冲区（防止大 Cookie / 长 URL 导致 414）默认4 8k
    large_client_header_buffers 4 16k;

    # --------------------------------------------------------
    # 静态资源文件缓存（减少磁盘 IO）
    # --------------------------------------------------------
    # 打开文件缓存
    # max：最大缓存条目
    # inactive：期间内未被访问则剔除
    open_file_cache max=10000 inactive=30s;
    # 缓存有效性检查周期
    open_file_cache_valid 60s;
    # 至少访问次数达到该值才进入缓存
    open_file_cache_min_uses 2;
    # 缓存文件查找错误信息（如文件不存在）
    open_file_cache_errors on;

    # --------------------------------------------------------
    # Gzip 压缩（带宽与 CPU 的平衡）
    # --------------------------------------------------------
    gzip on;
    gzip_comp_level 3;          # 压缩级别（1-9），3 为 CPU/压缩率最佳平衡点
    gzip_min_length 1024;       # 小于 1KB 的文件不压缩
    gzip_proxied any;           # 对所有代理请求启用压缩
    gzip_vary on;               # 添加 Vary: Accept-Encoding 头
    # 需要压缩的 MIME 类型
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript      # 兼容旧版 MIME
        application/xml
        application/rss+xml
        application/atom+xml
        application/manifest+json     # PWA manifest
        application/vnd.api+json      # JSON:API 规范
        image/svg+xml                 # SVG 是 XML 文本，压缩率高
        font/ttf
        font/otf
        application/font-sfnt         # 兼容旧版 Safari
        application/vnd.ms-fontobject;

    # --------------------------------------------------------
    # 安全与容器优化
    # --------------------------------------------------------
    # 隐藏 Server 头中的 NGINX 版本号
    server_tokens off;
    # 忽略非法请求头（提高健壮性）
    ignore_invalid_headers on;

    # --------------------------------------------------------
    # 站点配置入口
    # --------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}