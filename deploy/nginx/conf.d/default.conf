# ============================================================
# 默认站点配置（前端 SPA + API 反向代理）
# 适用：Vue / React / Vite + 原生后端
# ============================================================

server {
    # 监听 80 端口
    # default_server：未匹配域名的默认虚拟主机
    # backlog：高并发下连接队列长度
    listen 80 default_server backlog=65535;
    server_name localhost;

    # 站点根目录（Docker volume 挂载）
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------
    # 健康检查（Docker / 负载均衡用）
    # --------------------------------------------------------
    location = /nginx-health {
        access_log off;
        error_log off;
        return 200 "healthy\n";
    }

    # --------------------------------------------------------
    # API 反向代理（后端原生部署）
    # --------------------------------------------------------
    location /api/ {
        # 全局 access_log 已关闭，API 单独记录（便于审计）
        access_log /var/log/nginx/api_access.log main;
        error_log /var/log/nginx/api_error.log warn;

        # 转发到后端服务，需固定服务器IP
        proxy_pass http://192.168.2.35:8080/;

        # 使用 HTTP/1.1，支持长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 透传客户端信息（后端日志 / 鉴权必需）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时控制（防止连接堆积）
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 响应缓冲（减轻后端压力）
        proxy_buffering on;
        proxy_buffer_size 32k;
        proxy_buffers 16 16k;

        # 禁止后端重定向篡改
        proxy_redirect off;

        # 隐藏后端技术栈信息（安全）
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        # ---------- CORS 跨域支持 ----------
        # 允许任意来源（生产可按需收紧）
        add_header Access-Control-Allow-Origin $http_origin always;

        # 允许的 HTTP 方法
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;

        # 允许的请求头
        add_header Access-Control-Allow-Headers 'Authorization, Content-Type' always;

        # 允许携带 Cookie
        add_header Access-Control-Allow-Credentials 'true' always;

        # 预检请求（OPTIONS）直接返回 204
        # 使用 limit_except 替代 if（更高效、可维护）
        limit_except OPTIONS {
            # 非 OPTIONS 请求正常走代理
        }

        if ($request_method = OPTIONS) {
            return 204;
        }
    }


    # --------------------------------------------------------
    # 静态资源缓存（版本化资源）
    # 适用于 JS / CSS / 图片 / 字体
    # --------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        # 缓存一年（内容不可变）
        expires 365d;

        # immutable：浏览器不再发起条件请求
        add_header Cache-Control "public, immutable";

        # 静态资源不写访问日志，降低 IO
        access_log off;

        # 文件不存在直接返回 404，避免 fallback
        try_files $uri =404;
    }


    # --------------------------------------------------------
    # SPA 路由兜底
    # --------------------------------------------------------
    location / {
        # 先尝试真实文件，再交给前端路由
        try_files $uri $uri/ /index.html;

        # HTML 不缓存（确保前端发布立即生效）
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }


    # --------------------------------------------------------
    # 安全：禁止访问隐藏文件（.env / .git 等）
    # --------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }


    # --------------------------------------------------------
    # 错误页
    # --------------------------------------------------------
    # 404 交给 SPA 处理，但保留 404 状态码（SEO 友好）
    error_page 404 = /index.html;

    # 5xx 错误页
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}